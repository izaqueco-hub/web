<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 3 - Formas de incluir CSS</title>
    
    <!-- 2. MODO INTERNO: A regra fica aqui no cabeçalho -->
    <style>
        h2 {
            color: green;
        }
    </style>

    <!-- 3. MODO EXTERNO: Chama um arquivo separado (descomente se tiver um arquivo estilos.css) -->
    <!-- <link rel="stylesheet" href="estilos.css"> -->
</head>
<body>

    <h1>Atividade 3 - Formas de Incluir CSS</h1>

    <!-- 1. MODO INLINE: A regra fica direto na tag -->
    <p style="color: red;">1. Este texto é vermelho usando CSS Inline (direto na tag).</p>

    <h2>2. Este título é verde usando CSS Interno (tag style no topo).</h2>

    <p>3. O modo Externo usa uma tag &lt;link&gt; para carregar um arquivo .css separado.</p>

</body>
</html>
