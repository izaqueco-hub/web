<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 7 - Chat com CSS</title>
    <style>
        /* Caixa principal do telemóvel/chat */
        .chat-container {
            width: 350px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-family: Arial, sans-serif;
            margin: 20px auto;
        }

        /* Limpar o flutuador para cada linha de mensagem */
        .mensagem-linha {
            margin-bottom: 15px;
            clear: both;
        }

        /* Nome de quem enviou */
        .autor {
            font-size: 11px;
            color: #777;
            margin-bottom: 3px;
        }

        /* Balão de mensagem base */
        .balao {
            max-width: 75%;
            padding: 10px;
            border-radius: 8px;
            position: relative;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Mensagens do Pedro (Recebidas - Esquerda) */
        .linha-recebida .autor {
            text-align: left;
        }
        .balao-recebida {
            float: left;
            background-color: #ffffff;
            border: 1px solid #ddd;
            color: #333;
        }

        /* Mensagens Minhas (Enviadas - Direita) */
        .linha-enviada .autor {
            text-align: right;
        }
        .balao-enviada {
            float: right;
            background-color: #d4f8d4; /* Verdinho suave */
            border: 1px solid #b2e5b2;
            color: #333;
        }

        /* Horário dentro da mensagem */
        .hora {
            font-size: 10px;
            color: #888;
            float: right;
            margin-left: 10px;
            margin-top: 5px;
        }

        /* Área do rodapé para digitar mensagem */
        .area-envio {
            clear: both;
            margin-top: 20px;
            padding-top: 10px;
        }
        .caixa-texto {
            width: 100%;
            height: 60px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            resize: none;
        }
        .botao-enviar {
            float: right;
            margin-top: 5px;
            padding: 5px 15px;
            background-color: #efefef;
            border: 1px solid #999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-container">

        <!-- Mensagem 1 (Pedro) -->
        <div class="mensagem-linha linha-recebida">
            <div class="autor">Pedro Silva</div>
            <div class="balao balao-recebida">
                Olá, tudo bem?
                <span class="hora">00:50</span>
            </div>
        </div>

        <!-- Mensagem 2 (Eu) -->
        <div class="mensagem-linha linha-enviada">
            <div class="autor">Eu</div>
            <div class="balao balao-enviada">
                Estou bem sim, e você?
                <span class="hora">00:51</span>
            </div>
        </div>

        <!-- Mensagem 3 (Pedro) -->
        <div class="mensagem-linha linha-recebida">
            <div class="autor">Pedro Silva</div>
            <div class="balao balao-recebida">
                Vamos sair hoje? sabe conversar e Lorem ipsum dolor sit amet consectetur adipisicing elit.
                <span class="hora">01:01</span>
            </div>
        </div>

        <!-- Mensagem 4 (Eu) -->
        <div class="mensagem-linha linha-enviada">
            <div class="autor">Eu</div>
            <div class="balao balao-enviada">
                Criatura......
                <span class="hora">01:02</span>
            </div>
        </div>

        <!-- Caixa de Digitação -->
        <div class="area-envio">
            <textarea class="caixa-texto" placeholder="Digite sua mensagem"></textarea>
            <button class="botao-enviar">Enviar</button>
        </div>

    </div>

    <!-- 
      RESUMO PARA A PROVA:
      1. float: left -> Empurra os balões da outra pessoa para a esquerda.
      2. float: right -> Empurra os teus balões para a direita.
      3. clear: both -> Garante que cada mensagem fique numa linha nova sem encavalar.
    -->

</body>
</html>
