<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 6a - Display Block</title>
    <style>
        .caixa {
            display: block; /* Ocupa 100% da linha e empilha os blocos */
            background-color: #e74c3c; /* Vermelho */
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Atividade 6a: display: block</h2>

    <div class="caixa">Bloco 1 (Ocupa a linha inteira)</div>
    <div class="caixa">Bloco 2 (Fica na linha de baixo)</div>
    <div class="caixa">Bloco 3 (Empilhado)</div>

    <!-- 
      EXPLICAÇÃO PARA A PROVA:
      O display: block faz cada elemento ocupar toda a largura disponível (100%),
      forçando o próximo elemento a ir para a linha seguinte.
    -->

</body>
</html>
