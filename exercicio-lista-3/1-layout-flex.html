<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Layout Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: white;
        }

        /* Container principal ocupando 100% da tela */
        body {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Coluna da Esquerda - Navegação */
        nav {
            width: 20%;
            background-color: #ff7d29;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        /* Lado Direito - Contém Cabeçalho, Conteúdo e Rodapé */
        .painel-direito {
            width: 80%;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        header {
            height: 15%;
            background-color: #00a8e8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Conteúdo Principal */
        main {
            height: 70%;
            background-color: #5c3c92;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Rodapé */
        footer {
            height: 15%;
            background-color: #00a8e8;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Coluna Lateral de Navegação -->
    <nav>NAVEGAÇÃO</nav>

    <!-- Área Principal -->
    <div class="painel-direito">
        <header>CABEÇALHO</header>
        <main>CONTEÚDO</main>
        <footer>RODAPÉ</footer>
    </div>

</body>
</html>
