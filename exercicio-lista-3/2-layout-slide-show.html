<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Slide Show Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            padding: 20px;
        }

        /* Contentor Flexbox para as imagens */
        .galeria {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 450px;
            gap: 15px;
        }

        /* Cada cartão de imagem */
        .item {
            flex: 1; /* Todas começam com o mesmo tamanho */
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            transition: flex 0.5s ease-in-out; /* Transição suave na expansão */
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Imagens de fundo aleatórias do Unsplash */
        .item:nth-child(1) { background-image: url('https://picsum.photos/800/600?random=1'); }
        .item:nth-child(2) { background-image: url('https://picsum.photos/800/600?random=2'); }
        .item:nth-child(3) { background-image: url('https://picsum.photos/800/600?random=3'); }
        .item:nth-child(4) { background-image: url('https://picsum.photos/800/600?random=4'); }
        .item:nth-child(5) { background-image: url('https://picsum.photos/800/600?random=5'); }

        /* Efeito de expansão ao passar o rato (Hover) */
        .item:hover {
            flex: 5; /* Expande para ocupar maior espaço */
        }
    </style>
</head>
<body>

    <div class="galeria">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

</body>
</html>
