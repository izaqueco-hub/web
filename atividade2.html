<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 2 - Parágrafos Estilizados</title>
    <style>
        /* Parágrafo 1 */
        .texto-1 {
            font-family: Arial, sans-serif; /* Tipo da fonte */
            color: darkblue;               /* Cor do texto */
        }
        /* A palavra destacada do Parágrafo 1 */
        .texto-1 span {
            color: red;
            font-weight: bold;             /* Deixa em negrito */
        }

        /* Parágrafo 2 */
        .texto-2 {
            font-family: Georgia, serif;
            color: green;
        }
        /* A palavra destacada do Parágrafo 2 */
        .texto-2 span {
            background-color: yellow;      /* Fundo amarelo tipo marca-texto */
            color: black;
        }

        /* Parágrafo 3 */
        .texto-3 {
            font-family: 'Courier New', monospace;
            color: purple;
        }
        /* A palavra destacada do Parágrafo 3 */
        .texto-3 span {
            text-decoration: underline;    /* Sublinhado */
            font-size: 22px;
        }
    </style>
</head>
<body>

    <h1>Minha Página com Textos Diferentes</h1>

    <p class="texto-1">Lorem ipsum dolor sit amet, <span>esta palavra é vermelha</span> e o resto é azul.</p>

    <p class="texto-2">Lorem ipsum dolor sit amet, <span>esta palavra tem fundo amarelo</span> e o resto é verde.</p>

    <p class="texto-3">Lorem ipsum dolor sit amet, <span>esta palavra é sublinhada</span> e o resto é roxo.</p>

</body>
</html>
