<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 6b - Display Inline</title>
    <style>
        .caixa {
            display: inline; /* Fica na mesma linha, mas NAO aceita largura/altura */
            background-color: #3498db; /* Azul */
            color: white;
            padding: 10px;
            margin-right: 5px;
            /* Mesmo se colocarmos width: 200px aqui, o inline IGNORA! */
        }
    </style>
</head>
<body>

    <h2>Atividade 6b: display: inline</h2>

    <div class="caixa">Inline 1</div>
    <div class="caixa">Inline 2 (fica do lado)</div>
    <div class="caixa">Inline 3</div>

    <!-- 
      EXPLICAÇÃO PARA A PROVA:
      O display: inline deixa os elementos lado a lado na mesma linha,
      ocupando apenas o espaço do próprio texto. Não aceita width e height customizados.
    -->

</body>
</html>
