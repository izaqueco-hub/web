<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 6c - Display Inline-Block</title>
    <style>
        .caixa {
            display: inline-block; /* Lado a lado + Aceita tamanho! */
            width: 150px;          /* Define a largura */
            height: 80px;          /* Define a altura */
            background-color: #2ecc71; /* Verde */
            color: white;
            text-align: center;
            line-height: 80px;    /* Centraliza o texto na vertical */
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h2>Atividade 6c: display: inline-block</h2>

    <div class="caixa">Quadrado 1</div>
    <div class="caixa">Quadrado 2</div>
    <div class="caixa">Quadrado 3</div>

    <!-- 
      EXPLICAÇÃO PARA A PROVA:
      O display: inline-block combina as duas coisas: os elementos ficam lado a lado
      na mesma linha E respeitam as propriedades de tamanho (width e height).
    -->

</body>
</html>
