<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5 - Dashboard Responsivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eef2f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Grid do Mosaico (Desktop) */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr;
            grid-template-rows: auto auto auto;
            gap: 15px;
            width: 100%;
            max-width: 950px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Base para os blocos com cantos arredondados */
        .card {
            border-radius: 10px;
            min-height: 100px;
        }

        /* Cores fiéis aos mockups do PDF */
        .c-azul { background-color: #a8c5da; }
        .c-rosa { background-color: #e8b4b8; }
        .c-verde { background-color: #b5d5c5; }
        .c-laranja { background-color: #f4a261; }

        /* Posicionamento dos blocos estilo Dashboard */
        .item-1 { grid-column: 1 / span 3; grid-row: 1; }
        .item-2 { grid-column: 4; grid-row: 1 / span 2; }
        .item-3 { grid-column: 1 / span 2; grid-row: 2; }
        .item-4 { grid-column: 3; grid-row: 2; }
        .item-5 { grid-column: 1 / span 2; grid-row: 3; }
        .item-6 { grid-column: 3 / span 2; grid-row: 3; }

        /* Regra Responsiva: Ajuste para dispositivos abaixo de 500px */
        @media screen and (max-width: 500px) {
            .grid-container {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .card {
                width: 100%;
                min-height: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="card c-azul item-1"></div>
        <div class="card c-laranja item-2"></div>
        <div class="card c-rosa item-3"></div>
        <div class="card c-verde item-4"></div>
        <div class="card c-rosa item-5"></div>
        <div class="card c-verde item-6"></div>
    </div>

</body>
</html>
